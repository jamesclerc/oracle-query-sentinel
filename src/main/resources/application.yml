spring:
  application:
    name: oracle-query-sentinel
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: system
    password: oracle
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

sentinel:
  polling-interval-seconds: 30
  rules:
    slow-query-threshold-ms: 2000
    full-scan-min-rows: 10000
    lock-wait-threshold-seconds: 5
    n-plus-one-window-seconds: 10
    n-plus-one-min-occurrences: 5
  schemas:
    - HR
    - ATLAS_DATA
  store:
    max-anomalies: 10000

logging:
  level:
    dev.sentinel: INFO
    org.springframework.batch: WARN
